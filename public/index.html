<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Fishing</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0b1d2a}
body.tr{background:transparent}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#mk{position:fixed;left:6px;bottom:6px;z-index:10;font:12px sans-serif;max-width:340px}
#mk button{margin:2px;padding:5px 8px;border:0;border-radius:6px;background:#17415c;color:#fff;font:12px sans-serif;cursor:pointer;opacity:.92}
#mk button:hover{background:#1f6a96}
#mb{display:flex;flex-wrap:wrap;background:rgba(0,0,0,.55);padding:4px;border-radius:8px;margin-top:3px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mk"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/config.js"></script>
<script>
const QS=new URLSearchParams(location.search),TR=QS.get('transparent')==='1',MOCK=QS.get('mock')!=='0';
document.body.classList.toggle('tr',TR);
function fit(){const e=document.getElementById('c'),s=Math.min(innerWidth/1080,innerHeight/1920);e.style.width=(1080*s)+'px';e.style.height=(1920*s)+'px'}
addEventListener('resize',fit);fit();
if(MOCK){
const L=[['cau','🎣 Câu'],['like','❤️ Like'],['bait','🪱 Thay mồi'],['rose','🌹 Rose (1)'],['small','🎁 Quà nhỏ'],['vipgift','💎 VIP'],['big','🐋 Big Net'],['spot','🔦 Spot'],['keo','💪 Kéo'],['pha','💥 Phá'],['fake','🦆 Fake'],['slip','🩴 Ném dép'],['crab','🦀 Cua'],['dog','🐕 Chó'],['cat','🐈 Mèo'],['shoo','👋 Đuổi'],['afkwarn','⚠️ AFK cảnh báo'],['afkout','🚪 AFK out'],['frenzy','✨ Frenzy']];
const mk=document.getElementById('mk');
mk.innerHTML='<button id="mt">🧪 Mock ▾</button><div id="mb"></div>';
const mb=document.getElementById('mb');
L.forEach(a=>{const b=document.createElement('button');b.textContent=a[1];b.dataset.k=a[0];b.onclick=()=>{if(window.mockEvent)window.mockEvent(a[0])};mb.appendChild(b)});
document.getElementById('mt').onclick=()=>{mb.style.display=mb.style.display==='none'?'flex':'none'}
}else document.getElementById('mk').remove();
</script>
<script src="/audio.js"></script>
<script src="/game.js"></script>
<script src="/render.js"></script>
</body></html>
